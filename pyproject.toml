[project]
name = "tidal-playlist-manager"
version = "1.4.3"
description = "A modern TIDAL & Spotify Playlist Manager: Read, create, rename playlists, and move/copy tracks within and across TIDAL and Spotify with Web UI and CLI."
readme = "README.md"
license = "MIT"
authors = [
    { name = "magicclue" }
]
keywords = ["tidal", "spotify", "playlist", "manager", "music", "fastapi", "transfer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Environment :: Web Environment",
]
requires-python = ">=3.9"
dependencies = [
    "tidalapi>=0.8.11",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "mutagen>=1.47.0",
]

[project.scripts]
tidal-manager = "tidal_manager.cli:main"
tidal-playlist-manager = "tidal_manager.cli:main"

[project.urls]
Homepage = "https://github.com/tas231/TidalPlaylist"
Repository = "https://github.com/tas231/TidalPlaylist.git"
Issues = "https://github.com/tas231/TidalPlaylist/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tidal_manager*"]

[tool.setuptools.package-data]
tidal_manager = ["static/*", "static/**/*"]
