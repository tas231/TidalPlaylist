[project]
name = "tidal-playlist-manager"
version = "1.3.0"
description = "A modern TIDAL & Spotify Playlist Manager: Read, create, rename playlists, and move/copy tracks within and across TIDAL and Spotify with Web UI and CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "tidalapi>=0.8.11",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
