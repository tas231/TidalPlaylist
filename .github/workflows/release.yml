name: Build & Release Standalone Apps and Python Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TidalPlaylistManager-Windows-x64.zip
            binary_name: TidalPlaylistManager.exe
          - os: macos-latest
            artifact_name: TidalPlaylistManager-macOS.zip
            binary_name: TidalPlaylistManager
          - os: ubuntu-latest
            artifact_name: TidalPlaylistManager-Linux-x64.tar.gz
            binary_name: TidalPlaylistManager

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Binary with PyInstaller
        run: pyinstaller TidalPlaylistManager.spec

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TidalPlaylistManager.exe, README.md, LICENSE -DestinationPath dist/${{ matrix.artifact_name }}

      - name: Package archive (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/TidalPlaylistManager
          cd dist
          zip -r ${{ matrix.artifact_name }} TidalPlaylistManager ../README.md ../LICENSE

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/TidalPlaylistManager
          cd dist
          tar -czvf ${{ matrix.artifact_name }} TidalPlaylistManager ../README.md ../LICENSE

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/${{ matrix.artifact_name }}

  build-pypi-package:
    name: Build Python Wheel & Sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tool
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-artifacts
          path: dist/*

  create-github-release:
    name: Publish Release Assets to GitHub
    needs: [build-binaries, build-pypi-package]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Organize release files
        run: |
          mkdir -p final_assets
          find release_assets -type f -exec mv {} final_assets/ \;
          echo "Release Assets ready:"
          ls -la final_assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: final_assets/*
          generate_release_notes: true
